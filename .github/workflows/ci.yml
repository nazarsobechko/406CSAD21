name: CI

on:
  push:
    branches:
      - '**develop**'
      - '**master**'
  pull_request:
    branches:
      - '**develop**'
      - '**master**'

jobs:
  cross_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./ci.sh
        shell: bash

      - name: Run Unit Tests
        run: ctest -C Release --output-on-failure
        working-directory: build
        shell: bash

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os }}
          path: |
            build/hello
            build/unit_tests
            build/Release/hello.exe
            build/Release/unit_tests.exe
